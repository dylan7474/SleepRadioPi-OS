<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sleep Radio</title>
<style>
  /* The Sleep Radio desktop (served at /desktop). Layout: a desktop. Menu bar across the top; icons (objects) on a night-blue desktop with the
     case's art-deco sunburst as wallpaper; windows (containers) you move and resize; the radio
     itself sits on the desktop as an object you drop things on; the Trash in the corner.
     Deliberately one dark look, like the radio's own page. System fonts: it runs from the radio. */
  :root {
    /* light (the default): a pale platinum desktop, white windows, pinstriped title bars */
    --desk: #dcd8cf; --desk-2: #cfcabf; --ray: #ffffff30; --glow: #f3efe6;
    --win: #fbfaf7; --win-2: #f1eee7; --line: #cfc9bc; --title: #e7e3da; --stripe-a: #d9d4c8; --stripe-b: #eeeae2;
    --ink: #24221d; --dim: #6d685d; --faint: #9a958a;
    --amber: #e9a23a; --amber-ink: #231703; --amber-deep: #c98522;
    --blue: #2f6fd6; --red: #d2553f; --green: #3f9b68;
    --case: #efe9dc; --case-ink: #2b2a26; --case-line: #d2cab8; --knob: #2f5cb4;
    --menubar: #fbfaf7e6; --menubar-line: #bdb7aa; --label-shadow: 0 1px 0 #ffffffb0; --label-bg: #fbfaf7cc;
    --zebra: #00000006; --hover: #0000000c; --lane: #0000000a; --toast: #24221df0; --toast-ink: #fbfaf7;
    --shadow: #3a33251f; --close: #cfc9bc;
    --display: "Futura", "Century Gothic", "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --desk: #141827; --desk-2: #1b2136; --ray: #ffffff07; --glow: #2a2f4a;
    --win: #1c2030; --win-2: #242a3d; --line: #343b52; --title: #2a3148; --stripe-a: #333b56; --stripe-b: #2a3148;
    --ink: #ece6d6; --dim: #9b968a; --faint: #6d6a62;
    --amber: #f2b24a; --blue: #6f97e0; --red: #e0664f; --green: #7cc49a;
    --menubar: #0d0f18ee; --menubar-line: #000; --label-shadow: 0 1px 2px #000c; --label-bg: transparent;
    --zebra: #ffffff05; --hover: #ffffff0d; --lane: #0000002a; --toast: #0d0f18f2; --toast-ink: #ece6d6;
    --shadow: #000a; --close: #d9d4c7;
    color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --desk: #141827; --desk-2: #1b2136; --ray: #ffffff07; --glow: #2a2f4a;
    --win: #1c2030; --win-2: #242a3d; --line: #343b52; --title: #2a3148; --stripe-a: #333b56; --stripe-b: #2a3148;
    --ink: #ece6d6; --dim: #9b968a; --faint: #6d6a62;
    --amber: #f2b24a; --blue: #6f97e0; --red: #e0664f; --green: #7cc49a;
    --menubar: #0d0f18ee; --menubar-line: #000; --label-shadow: 0 1px 2px #000c; --label-bg: transparent;
    --zebra: #ffffff05; --hover: #ffffff0d; --lane: #0000002a; --toast: #0d0f18f2; --toast-ink: #ece6d6;
    --shadow: #000a; --close: #d9d4c7;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--desk); color: var(--ink); font: 13px/1.4 var(--body); overflow: hidden; user-select: none; -webkit-user-select: none; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* menu bar */
  .menubar { position: fixed; inset: 0 0 auto 0; height: calc(30px + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px);
             display: flex; align-items: center; gap: 1.1rem; padding-inline: 14px; background: var(--menubar); border-bottom: 1px solid var(--menubar-line);
             z-index: 1000; backdrop-filter: blur(8px); font-size: 13px; }
  .menubar .logo { font-family: var(--display); font-weight: 700; letter-spacing: .18em; }
  .menubar .logo span { color: var(--amber); }
  .menubar .m { color: var(--dim); background: none; border: 0; padding: 2px 4px; border-radius: 4px; }
  .menubar .m:hover { color: var(--ink); background: var(--hover); }
  .menubar .grow { flex: 1; }
  .proto { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--amber-deep); border: 1px solid #e9a23a77; border-radius: 99px; padding: 1px 8px; white-space: nowrap; }
  .onair { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--red); white-space: nowrap; }
  .onair::before { content: "● "; }
  .clock { font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }

  /* the desktop */
  .desktop { position: fixed; inset: calc(30px + env(safe-area-inset-top, 0px)) 0 0 0; overflow: hidden;
             background:
               radial-gradient(ellipse at 50% 120%, var(--glow) 0%, transparent 60%),
               repeating-conic-gradient(from -90deg at 50% 118%, var(--ray) 0 3deg, transparent 3deg 9deg),
               linear-gradient(180deg, var(--desk) 0%, var(--desk-2) 100%); }
  .desktop.over { box-shadow: inset 0 0 0 3px #6f97e055; }

  /* icons */
  .icon { position: absolute; width: 96px; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 2px;
          border-radius: 8px; touch-action: none; cursor: default; }
  .icon .lbl { font-size: 12px; line-height: 1.25; text-align: center; max-width: 94px; padding: 1px 5px; border-radius: 4px;
               display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-shadow: var(--label-shadow); background: var(--label-bg); }
  .icon .sub { font-size: 10.5px; color: var(--dim); margin-top: -3px; text-align: center; max-width: 94px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon.sel .lbl { background: var(--amber); color: var(--amber-ink); text-shadow: none; }
  .themebtn { border: 1px solid var(--line); background: var(--win); color: var(--ink); border-radius: 99px; padding: 1px 10px; font-size: 12px; }
  .icon.sel .glyph { filter: brightness(1.15); }
  .icon.over .glyph { outline: 2px solid var(--blue); outline-offset: 3px; }
  .icon.alias .lbl { font-style: italic; }
  .icon.alias .glyph::after { content: "↗"; position: absolute; left: -2px; bottom: -2px; width: 16px; height: 16px; border-radius: 4px;
                               background: #fff; color: #000; font: 700 11px/16px var(--body); text-align: center; }
  .grid .icon, .grid .icon.alias { position: relative; }

  /* glyphs, one look per kind of thing */
  .glyph { width: 60px; height: 60px; position: relative; flex: none; }
  .g-folder { background: linear-gradient(180deg, #f5c46b, #d99a35); border-radius: 4px 8px 8px 8px; margin-top: 6px; height: 50px;
              box-shadow: 0 3px 8px #0008, inset 0 1px 0 #ffe2a4; display: grid; place-items: center; color: #6b4410; font: 700 20px var(--display); }
  .g-folder::before { content: ""; position: absolute; left: 0; top: -7px; width: 26px; height: 9px; background: #e8ad4c; border-radius: 4px 4px 0 0; }
  .g-folder.alt { background: linear-gradient(180deg, #9fb3d9, #6c83b3); color: #1d2a47; box-shadow: 0 3px 8px #0008, inset 0 1px 0 #cbd8f2; }
  .g-folder.alt::before { background: #8ea3cc; }
  .g-album { border-radius: 3px; background: linear-gradient(135deg, hsl(var(--h) 55% 50%), hsl(calc(var(--h) + 40) 55% 28%));
             box-shadow: 0 4px 10px #000a; display: grid; place-items: end start; padding: 5px; color: #fff; font: 700 13px/1 var(--display); letter-spacing: .03em; overflow: visible; }
  .g-album::before { content: ""; position: absolute; right: -9px; top: 4px; width: 52px; height: 52px; border-radius: 50%; z-index: -1;
                     background: radial-gradient(circle, hsl(var(--h) 60% 55%) 0 16%, #111 17%, #222 40%, #111 41%, #1d1d1d 70%, #0c0c0c 71%); }
  .g-track { border-radius: 50%; background: repeating-radial-gradient(circle, #181818 0 2px, #232323 2px 3px);
             box-shadow: 0 4px 10px #000a; }
  .g-track::after { content: ""; position: absolute; inset: 21px; border-radius: 50%; background: radial-gradient(circle, #111 0 12%, hsl(var(--h) 60% 55%) 13%); }
  .g-station { border-radius: 9px; background: var(--case); box-shadow: 0 4px 10px #000a; overflow: hidden; }
  .g-station::before { content: attr(data-short); position: absolute; left: 6px; right: 6px; top: 6px; height: 17px; border-radius: 4px;
                       background: linear-gradient(180deg, #f7c86d, var(--amber-deep)); color: var(--amber-ink); font: 700 10px/17px var(--display); text-align: center; letter-spacing: .05em; }
  .g-station::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 7px; height: 26px; border-radius: 4px;
                      background: radial-gradient(circle, #8a8474 1.3px, transparent 1.6px) 0 0 / 6px 6px; }
  .g-podcast { border-radius: 50%; background: radial-gradient(circle, #fff 0 9%, hsl(var(--h) 45% 55%) 10% 24%, hsl(var(--h) 40% 35%) 25% 38%, hsl(var(--h) 45% 48%) 39% 52%, hsl(var(--h) 40% 30%) 53%);
               box-shadow: 0 4px 10px #000a; }
  .g-episode { border-radius: 10px; background: linear-gradient(160deg, hsl(var(--h) 40% 45%), hsl(var(--h) 40% 25%)); box-shadow: 0 4px 10px #000a;
               display: grid; place-items: center; color: #fff; font: 700 11px var(--mono); }
  .g-book { width: 48px; border-radius: 2px 6px 6px 2px; background: linear-gradient(90deg, hsl(var(--h) 40% 22%) 0 8px, hsl(var(--h) 45% 40%) 8px);
            box-shadow: 0 4px 10px #000a, inset -3px 0 0 #fff2; color: #fff; font: 700 12px/1.1 var(--display); padding: 8px 5px 0 12px; }
  .g-playlist { background: none; }
  .g-playlist i { position: absolute; left: 6px; right: 6px; height: 38px; border-radius: 6px; background: hsl(var(--h) 50% 50%); box-shadow: 0 3px 8px #0009; }
  .g-playlist i:nth-child(1) { top: 2px; opacity: .45; transform: scale(.86); } .g-playlist i:nth-child(2) { top: 8px; opacity: .7; transform: scale(.93); }
  .g-playlist i:nth-child(3) { top: 15px; background: repeating-linear-gradient(180deg, transparent 0 7px, #ffffff55 7px 9px) 8px 7px / 70% 70% no-repeat, hsl(var(--h) 50% 50%); }
  .g-programme { border-radius: 50%; background: var(--dial, #333); box-shadow: 0 4px 10px #000a, inset 0 0 0 3px #11131c; }
  .g-programme::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: #11131c; }
  .g-programme::after { content: ""; position: absolute; left: 29px; top: 16px; width: 2px; height: 15px; background: var(--amber); transform-origin: 1px 14px; transform: rotate(var(--hand, 0deg)); box-shadow: 0 0 0 0 #0000; }
  .g-sound { border-radius: 8px; background: linear-gradient(180deg, #3a4460, #262d42); box-shadow: 0 4px 10px #000a; }
  .g-sound svg { position: absolute; inset: 10px 8px; width: 44px; height: 40px; }
  .g-list { border-radius: 12px; background: linear-gradient(160deg, #6fa8bd, #3f6f82); box-shadow: 0 4px 10px #000a; display: grid; place-items: center; color: #fff; font: 700 18px var(--display); }
  .g-show { border-radius: 10px; background: linear-gradient(180deg, #f7c86d, var(--amber-deep)); box-shadow: 0 4px 10px #000a; color: var(--amber-ink);
            display: grid; place-items: center; font: 700 9px/1.1 var(--display); letter-spacing: .14em; text-align: center; }
  .g-trash { width: 46px; height: 56px; }
  .g-trash::before { content: ""; position: absolute; left: 3px; right: 3px; top: 10px; bottom: 0; border-radius: 3px 3px 7px 7px;
                     background: repeating-linear-gradient(90deg, #aab0bf 0 5px, #8b91a1 5px 8px); box-shadow: 0 4px 10px #000a; }
  .g-trash::after { content: ""; position: absolute; left: 0; right: 0; top: 3px; height: 7px; border-radius: 3px; background: #c4c9d6; }
  .g-trash.full::before { background: repeating-linear-gradient(90deg, #c7ccd8 0 5px, #a3a9b8 5px 8px); }

  /* windows */
  .win { position: absolute; background: var(--win); border: 1px solid var(--menubar-line); border-radius: 9px; box-shadow: 0 18px 50px var(--shadow), 0 0 0 1px #ffffff10 inset;
         display: flex; flex-direction: column; min-width: 280px; min-height: 180px; overflow: hidden; }
  .win.over { box-shadow: 0 18px 50px var(--shadow), 0 0 0 3px var(--blue); }
  .tbar { height: 28px; flex: none; display: flex; align-items: center; gap: 8px; padding-inline: 8px; background: var(--title); cursor: grab; touch-action: none;
          border-bottom: 1px solid var(--line); }
  .win.front .tbar { background: repeating-linear-gradient(180deg, var(--stripe-a) 0 1px, var(--stripe-b) 1px 3px); }
  .tbar .close { width: 13px; height: 13px; border-radius: 3px; border: 1px solid #0006; background: var(--close); padding: 0; flex: none; }
  .win.front .tbar .close { background: var(--red); }
  .tbar .ttl { flex: 1; text-align: center; font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win.front .tbar .ttl span { background: var(--stripe-b); padding: 0 8px; }
  .tbar .kindtag { width: 13px; }
  .wtools { display: flex; gap: 6px; padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--win-2); flex-wrap: wrap; align-items: center; }
  .wtools .t { border: 1px solid var(--line); background: var(--win); border-radius: 6px; padding: 3px 9px; font-size: 12px; }
  .wtools .t.primary { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); font-weight: 600; }
  .wtools .t:disabled { opacity: .4; cursor: default; }
  .wtools .note { color: var(--dim); font-size: 11.5px; margin-left: auto; }
  .wbody { flex: 1; overflow: auto; position: relative; }
  .grid { display: flex; flex-wrap: wrap; gap: 4px 2px; padding: 12px; align-content: flex-start; min-height: 100%; }
  .wfoot { flex: none; padding: 4px 10px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11.5px; display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
  .resize { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; touch-action: none;
            background: linear-gradient(135deg, transparent 50%, #ffffff33 50% 58%, transparent 58% 70%, #ffffff33 70% 78%, transparent 78%); }
  .empty { color: var(--dim); padding: 22px; text-align: center; width: 100%; }

  /* list views (an album's tracks, a playlist, episodes) */
  .rows { list-style: none; margin: 0; padding: 6px; }
  .row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 5px 8px; border-radius: 6px; touch-action: none; }
  .row:nth-child(odd) { background: var(--zebra); }
  .row:hover { background: var(--hover); }
  .row.sel { background: #f2b24a26; }
  .row .n { color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; }
  .row b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row b small { color: var(--dim); font-weight: 400; margin-left: 6px; }
  .row .len { color: var(--dim); font-variant-numeric: tabular-nums; }
  .row .play { border: 0; background: none; color: var(--amber); width: 26px; height: 22px; border-radius: 5px; }
  .row .play:hover { background: #f2b24a22; }

  /* programme window */
  .prog { padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
  .ruler { position: relative; height: 18px; border-bottom: 1px solid var(--line); }
  .ruler span { position: absolute; bottom: 2px; transform: translateX(-50%); font-size: 10.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .ruler i { position: absolute; bottom: -1px; width: 1px; height: 5px; background: var(--line); }
  .lane { position: relative; height: 92px; border-radius: 8px; background: repeating-linear-gradient(90deg, var(--hover) 0 1px, transparent 1px var(--hourpx)) 0 0 / var(--hourpx) 100%, var(--lane);
          border: 1px dashed transparent; }
  .lane.over { border-color: var(--blue); }
  .blk { position: absolute; top: 6px; bottom: 6px; border-radius: 7px; background: linear-gradient(180deg, hsl(var(--h) 45% 42%), hsl(var(--h) 45% 30%));
         box-shadow: 0 3px 10px var(--shadow), inset 0 1px 0 #ffffff25; color: #fff; padding: 6px 14px 6px 8px; overflow: hidden; touch-action: none; cursor: grab; min-width: 18px; }
  .blk.sel { outline: 2px solid var(--amber); }
  .blk.over { outline: 2px solid var(--blue); }
  .blk .bt { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk .bw { font-size: 11px; opacity: .8; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .blk .bi { display: flex; gap: 3px; margin-top: 5px; }
  .blk .bi .glyph { width: 22px; height: 22px; transform: none; }
  .blk .bi .glyph * { display: none; }
  .blk .pin { position: absolute; right: 16px; bottom: 6px; font-size: 10px; background: #0006; border-radius: 4px; padding: 0 4px; }
  .blk .grab { position: absolute; right: 0; top: 0; bottom: 0; width: 10px; cursor: ew-resize; background: linear-gradient(90deg, transparent, #ffffff30); }
  .gapmark { position: absolute; top: 40px; height: 2px; border-top: 2px dotted var(--line); }
  .now { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--red); box-shadow: 0 0 8px var(--red); }
  .insp { background: var(--win-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; }
  .insp .line { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .insp input, .insp select { background: var(--win); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; }
  .insp input.name { font-weight: 600; min-width: 0; flex: 1; }
  .pill { border: 1px solid var(--line); background: var(--win); border-radius: 99px; padding: 2px 10px; font-size: 12px; color: var(--dim); }
  .pill[aria-pressed="true"] { color: var(--ink); border-color: var(--dim); background: var(--hover); }
  .chipx { display: inline-flex; align-items: center; gap: 6px; background: var(--win); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px 2px 3px; font-size: 12px; }
  .chipx .glyph { width: 18px; height: 18px; box-shadow: none; }
  .chipx .glyph::before, .chipx .glyph::after { display: none; }
  .chipx button { border: 0; background: none; color: var(--dim); padding: 0 3px; }
  .muted { color: var(--dim); font-size: 12px; }

  /* the radio on the desktop */
  .radio { position: absolute; width: 290px; background: var(--case); color: var(--case-ink); border-radius: 18px; padding: 12px 14px 14px;
           box-shadow: 0 22px 50px var(--shadow), 0 0 0 1px #0000001a, inset 0 -4px 0 #0000001a, inset 0 2px 0 #fff; touch-action: none; }
  .radio .handle { position: absolute; left: 50%; top: -12px; width: 120px; height: 16px; transform: translateX(-50%); border: 5px solid #cfc7b4; border-bottom: 0; border-radius: 12px 12px 0 0; }
  .rdial { position: relative; height: 70px; border-radius: 9px; background: linear-gradient(180deg, #f7c86d, var(--amber) 55%, var(--amber-deep));
           color: var(--amber-ink); padding: 7px 10px; box-shadow: inset 0 1px 0 #ffe3a6, inset 0 -2px 6px #0003; overflow: hidden; }
  .rdial.over { box-shadow: 0 0 0 3px var(--blue), inset 0 1px 0 #ffe3a6; }
  .rdial small { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; opacity: .75; display: block; }
  .rdial b { font: 700 15px/1.2 var(--display); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rdial em { font-style: normal; font-size: 11.5px; opacity: .85; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rdial .scale { position: absolute; left: 10px; right: 10px; bottom: 6px; height: 6px; border-bottom: 1px solid #23170355;
                  background: repeating-linear-gradient(90deg, #23170355 0 1px, transparent 1px 8px) bottom / 100% 4px no-repeat; }
  .rdial .needle { position: absolute; bottom: 3px; top: 38px; width: 2px; background: var(--red); left: 20%; transition: left .8s cubic-bezier(.3,1.4,.5,1); }
  .rface { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-top: 11px; }
  .grille { height: 64px; border-radius: 50%; background: radial-gradient(circle, #9b9483 1.5px, transparent 1.8px) 0 0 / 7px 7px; opacity: .9; }
  .knob { width: 66px; height: 66px; border-radius: 50%; border: 0; background: radial-gradient(circle at 35% 30%, #5b86d6, var(--knob) 55%, #1d3d7c);
          box-shadow: 0 4px 10px #0006, inset 0 0 0 4px #ffffff1a; position: relative; }
  .knob::after { content: ""; position: absolute; left: 32px; top: 8px; width: 3px; height: 18px; border-radius: 2px; background: #fff; transform-origin: 1.5px 25px; transform: rotate(var(--rot, 0deg)); }
  .rvol { text-align: center; font-size: 11px; color: #6b6558; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .pbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .pbtn button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: radial-gradient(circle at 40% 35%, #fff, #c8ccd2 70%, #9aa0a8);
                 box-shadow: 0 3px 6px #0005, inset 0 -2px 3px #0002; font: 700 14px var(--display); color: #444; }
  .pbtn.over button { box-shadow: 0 0 0 3px var(--blue); }
  .pbtn.on button { box-shadow: 0 0 0 2px var(--amber), 0 3px 6px #0005; }
  .pbtn span { font-size: 10.5px; line-height: 1.15; text-align: center; color: #4d493f; max-width: 64px; height: 2.3em; overflow: hidden; }
  .badge { position: absolute; right: 14px; top: 16px; font: 700 8.5px var(--display); letter-spacing: .2em; color: #2f5cb4; }

  /* the radio's back: settings as objects in a container */

  .grille { cursor: pointer; } .grille:hover { opacity: 1; filter: contrast(1.4); }
  .presets { cursor: default; } .plink { font-size: 10.5px; color: #6b6558; background: none; border: 0; padding: 2px 0; }

  @keyframes flip { 0% { transform: perspective(900px) rotateY(0); } 50% { transform: perspective(900px) rotateY(90deg); } 100% { transform: perspective(900px) rotateY(0); } }
  .bpanel { border-radius: 10px; background: #d8d1c0; box-shadow: inset 0 1px 4px #0002; padding: 10px; position: relative; }
  .bpanel::before, .bpanel::after { content: ""; position: absolute; width: 7px; height: 7px; border-radius: 50%; top: 5px; background: radial-gradient(circle, #8a8474 0 30%, #b9b19f 35%); }
  .bpanel::before { left: 5px; } .bpanel::after { right: 5px; }

         touch-action: none; cursor: pointer; min-width: 0; box-shadow: 0 1px 0 #fff inset, 0 1px 2px #0002; }

  .g-panel { border-radius: 9px; background: linear-gradient(160deg, hsl(var(--h) 35% 55%), hsl(var(--h) 35% 38%)); box-shadow: 0 3px 8px var(--shadow);
             display: grid; place-items: center; color: #fff; font: 700 var(--gs, 22px)/1 var(--display); }
  .mod .g-panel { --gs: 14px; }
  .g-note { width: 56px; height: 56px; background: linear-gradient(135deg, #fff39a 0 82%, #e6d35f 82%); box-shadow: 0 4px 10px var(--shadow);
            transform: rotate(var(--tilt, -3deg)); padding: 6px 7px; color: #5a4f10; font: 11px/1.2 "Marker Felt", "Comic Sans MS", var(--body); overflow: hidden; }
  .g-cal { width: 52px; height: 58px; border-radius: 6px; background: #fff; box-shadow: 0 4px 10px var(--shadow); overflow: hidden; text-align: center; color: #333; }
  .g-cal::before { content: attr(data-mon); display: block; background: var(--red); color: #fff; font: 700 10px/16px var(--display); letter-spacing: .12em; }
  .g-cal::after { content: attr(data-day); display: block; font: 700 26px/38px var(--display); }
  .g-dj { border-radius: 50%; background: radial-gradient(circle at 50% 38%, #f1c9a0 0 22%, transparent 23%), radial-gradient(circle at 50% 100%, #2f5cb4 0 42%, transparent 43%), #f2b24a;
          box-shadow: 0 4px 10px var(--shadow); }
  .g-dj::before { content: ""; position: absolute; left: 13px; right: 13px; top: 9px; height: 20px; border: 4px solid #222; border-bottom: 0; border-radius: 20px 20px 0 0; }
  .g-dj::after { content: ""; position: absolute; left: 10px; right: 10px; top: 22px; height: 11px; background: linear-gradient(90deg, #222 0 8px, transparent 8px calc(100% - 8px), #222 calc(100% - 8px)); border-radius: 4px; }
  /* settings windows */
  .set { padding: 14px 16px; display: grid; gap: 14px; }
  .set h3 { margin: 0; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .set .grp { display: grid; gap: 9px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }

  .srow { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 10px; align-items: center; }

  .srow output { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
  .seg { display: inline-flex; flex-wrap: wrap; background: var(--win-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button { border: 0; background: none; border-radius: 6px; padding: 3px 10px; color: var(--dim); font-size: 12px; }
  .seg button[aria-pressed="true"] { background: var(--win); color: var(--ink); box-shadow: 0 1px 3px var(--shadow); font-weight: 600; }
  .sw { width: 38px; height: 22px; border-radius: 99px; border: 0; background: var(--line); position: relative; padding: 0; }
  .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0005; transition: left .15s; }
  .sw[aria-checked="true"] { background: var(--green); }

  .set input[type=range] { width: 100%; accent-color: var(--amber); }
  .set input[type=text], .set input[type=time], .set input[type=password], .set select { background: var(--win-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; min-width: 0; }
  .sbtn { border: 1px solid var(--line); background: var(--win-2); border-radius: 7px; padding: 4px 11px; font-size: 12px; }
  .sbtn.primary { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); font-weight: 600; }
  .sbtn.danger { color: var(--red); }
  .shelp { color: var(--dim); font-size: 12px; margin: 0; }
  .set .line { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  @media (max-width: 560px) { .srow { grid-template-columns: minmax(0, 1fr); } }
  .netrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 5px 8px; border-radius: 6px; }
  .netrow:nth-child(odd) { background: var(--zebra); }
  .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
  .bars i { width: 3px; background: var(--dim); border-radius: 1px; } .bars i.on { background: var(--ink); }
  .notearea { width: 100%; min-height: 130px; resize: vertical; border: 0; background: #fff39a; color: #3d3508; border-radius: 6px; padding: 10px;
              font: 16px/1.35 "Marker Felt", "Comic Sans MS", var(--body); box-shadow: inset 0 0 0 1px #e6d35f; }
  .menubar .wifi { background: none; border: 0; color: var(--ink); display: inline-flex; gap: 6px; align-items: center; padding: 2px 4px; border-radius: 4px; }
  .menubar .wifi:hover { background: var(--hover); }
  .ghost { position: fixed; z-index: 2000; pointer-events: none; opacity: .9; transform: translate(-50%, -55%) scale(1.05); }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); z-index: 3000;
           background: var(--toast); color: var(--toast-ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; max-width: min(560px, calc(100% - 32px));
           box-shadow: 0 10px 30px var(--shadow); font-size: 13px; }
  .confirm { position: fixed; inset: 0; z-index: 2500; display: grid; place-items: center; background: #0006; }
  .confirm .box { background: var(--win); border: 1px solid var(--menubar-line); border-radius: 10px; padding: 16px 18px; width: min(380px, calc(100% - 32px)); box-shadow: 0 20px 60px #000c; }
  .confirm .box p { margin: 0 0 14px; }
  .confirm .btns { display: flex; gap: 8px; justify-content: flex-end; }
  .confirm .btns button { border: 1px solid var(--line); background: var(--win-2); border-radius: 6px; padding: 5px 12px; }
  .confirm .btns .danger { background: var(--red); border-color: var(--red); color: #1a0703; font-weight: 600; }

  /* narrow screens: icons flow, windows open full-size one at a time */

    .resize { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .rdial .needle { transition: none; } }
</style>
<style>
  .frame { flex: 1; border: 0; width: 100%; background: var(--win); }

<body>
<header class="menubar">
  <span class="logo" id="logo">SLEEP <span>RADIO</span></span>
  <button class="m" type="button" data-open="root:music">Music</button>
  <button class="m" type="button" data-open="root:ondemand">On demand</button>
  <button class="m" type="button" data-open="box:programmes">Programmes</button>
  <button class="m" type="button" id="tidy">Tidy up</button>
  <button class="m" type="button" id="settingsMenu">Settings</button>
  <a class="m classic" href="/" title="The page you know, also for phones">Classic page</a>
  <span class="grow"></span>
  <button class="themebtn" type="button" id="theme" title="Light or dark">Dark</button>
  <button class="wifi" type="button" id="wifiMenu" title="Wi-Fi"><span class="bars"><i class="on" style="height:4px"></i><i class="on" style="height:7px"></i><i class="on" style="height:10px"></i><i class="on" style="height:12px"></i></span><span>Wi-Fi</span></button>
  <span class="onair" id="onair" hidden>On air</span>
  <span class="clock" id="clock"></span>
</header>

<main class="desktop" id="desk" data-drop="desk" aria-label="Desktop"></main>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
// ============ talking to the radio ============
async function api(path, body) {
  const r = await fetch(path, body === undefined ? { cache: "no-store" }
    : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (r.status === 401) { showLogin(); throw new Error("the radio wants its password"); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `the radio said no (${r.status})`);
  return d;
}
function showLogin() {
  if (document.querySelector(".login")) return;
  const pw = el("input", { type: "password", placeholder: "The radio's password", id: "pw" });
  pw.setAttribute("aria-label", "Password");
  const f = el("form", {}, el("b", { textContent: "This radio has a password" }), pw, el("button", { type: "submit", textContent: "Log in" }));
  const box = el("div", { className: "login" }, f);
  f.onsubmit = async e => {
    e.preventDefault();
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw.value }) });
    if (r.ok) { box.remove(); boot(); } else { pw.value = ""; pw.placeholder = "Not that one: try again"; }
  };
  document.body.append(box); pw.focus();
}

// ============ the things (objects) ============
const O = {};
const hue = s => [...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
function mk(o) { if (O[o.id]) return Object.assign(O[o.id], o); o.h = o.h ?? hue(o.title); O[o.id] = o; return o; }
const lastPart = p => p.split("/").pop();
const cleanName = p => lastPart(p).replace(/\.[^.]+$/, "").replace(/^\d+\s*[-.]\s*/, "");
const initials = s => String(s).replace(/^The /, "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const dur = m => m == null ? "" : m >= 60 ? `${Math.floor(m / 60)} h${Math.round(m % 60) ? " " + Math.round(m % 60) : ""}` : `${Math.max(1, Math.round(m))} min`;
const TRACK_MIN = 3.5;       // a guess for lengths the library doesn't report

let radioName = "Sleep Radio";
const MUSIC = mk({ id: "root:music", kind: "folder", title: "Music", root: "music", path: "", kids: [], sym: "♪" });
const ONDEMAND = mk({ id: "root:ondemand", kind: "folder", title: "On demand", root: "ondemand", path: "", kids: [], sym: "◐", alt: true });
const BOOKS = mk({ id: "box:books", kind: "folder", title: "Audiobooks", box: "books", kids: [], sym: "B" });
const PODCASTS = mk({ id: "box:podcasts", kind: "folder", title: "Podcasts", box: "podcasts", kids: [], sym: "P" });
const STATIONS = mk({ id: "box:stations", kind: "folder", title: "Stations", box: "stations", kids: [], sym: "R", alt: true });
const PLAYLISTS = mk({ id: "box:playlists", kind: "folder", title: "Playlists", box: "playlists", kids: [], sym: "≡" });
const PROGRAMMES = mk({ id: "box:programmes", kind: "folder", title: "Programmes", box: "programmes", kids: [], sym: "◷" });
const LISTS = mk({ id: "box:lists", kind: "folder", title: "Artist radio", box: "lists", kids: [], sym: "A", alt: true });
const TRASH = mk({ id: "trash", kind: "trash", title: "Trash", kids: [] });
const SHOW = mk({ id: "show", kind: "show", title: "Sleep Radio" });
// settings: each one an object; for now each opens the classic page's version in a window
const PANELS = [
  ["dj", "The DJ", "DJ", 40, "dj"], ["speakers", "Speakers", "♫", 28, "speakers"], ["buttons", "Buttons", "4", 200, null],
  ["noise", "Noise", "≈", 250, "noise"], ["voices", "Voices", "“", 300, "voices"], ["wifi", "Wi-Fi", "⌔", 190, "wifi"],
  ["identity", "This radio", "R", 40, "identity"], ["password", "Password", "✱", 350, "password"], ["updates", "Updates", "↑", 130, "updates"],
  ["backup", "Save & load", "⇅", 170, "backup"], ["power", "Power", "⏻", 5, "power"], ["library", "Media library", "▤", 30, "library"],
];
const PANEL = {};
for (const [key, title, sym, h, page] of PANELS) PANEL[key] = mk({ id: "set:" + key, kind: "panel", key, title, sym, h, page });
for (const [key, title, sym, h] of [["messages", "Messages", "✎", 55], ["birthdays", "Birthdays", "✿", 340], ["stations", "Stations", "R", 8],
                                    ["tests", "Test sounds", "▶", 150], ["stream", "Listen in a browser", "◠", 200], ["lists", "Artist lists", "A", 195]])
  PANEL[key] = mk({ id: "set:" + key, kind: "panel", key, title, sym, h, page: key });
const DJ = mk({ id: "dj", kind: "dj", title: "The DJ" });
const NOTES = mk({ id: "notes", kind: "note", title: "Messages", text: "Messages the DJ reads out" });
const BDAYS = mk({ id: "bdays", kind: "calendar", title: "Birthdays" });
const parentOf = id => Object.values(O).find(o => o.kids && o.kids.includes(id));

// ---- loading from the radio ----
function trackObj(root, t, albumTitle) {
  return mk({ id: "t:" + root + ":" + t.path, kind: "track", title: t.title || cleanName(t.path), artist: t.artist || "", root, path: t.path,
              n: t.n != null ? t.n + 1 : undefined, h: hue(albumTitle || lastPart(t.path.split("/").slice(0, -1).join("/"))) });
}
async function loadFolder(f) {
  if (f.root) {
    const d = await api(`/api/browse?root=${f.root}&path=${encodeURIComponent(f.path)}`);
    const kids = d.folders.map(x => {
      const path = f.path ? f.path + "/" + x.name : x.name, leaf = x.own && !x.folders;
      const o = mk({ id: (leaf ? "a:" : "f:") + f.root + ":" + path, kind: leaf ? "album" : "folder", title: O[(leaf ? "a:" : "f:") + f.root + ":" + path]?.title || x.name,
                     root: f.root, path, kids: O[(leaf ? "a:" : "f:") + f.root + ":" + path]?.kids || [], count: x.tracks, folders: x.folders, alt: f.root === "ondemand" });
      return o.id;
    });
    if (d.album) for (const t of d.album.list) kids.push(trackObj(f.root, t, d.album.title).id);
    try {                                            // empty folders too (the library only lists ones with music)
      const m = await api(`/api/media?kind=${f.root}&path=${encodeURIComponent(f.path)}`);
      for (const x of m.folders) {
        const path = f.path ? f.path + "/" + x.name : x.name;
        if (!kids.includes("f:" + f.root + ":" + path) && !kids.includes("a:" + f.root + ":" + path))
          kids.push(mk({ id: "f:" + f.root + ":" + path, kind: "folder", title: x.name, root: f.root, path, kids: [], count: 0, alt: f.root === "ondemand" }).id);
      }
    } catch {}
    f.kids = kids;
  } else if (f.box === "books") {
    const d = await api("/api/books");
    f.kids = d.books.map(b => mk({ id: "b:" + b.key, kind: "book", key: b.key, title: b.title, artist: b.author,
      min: Math.max(1, (b.total_ms - (b.pos_ms || 0)) / 60000), left: b.pos_ms ? `${dur((b.total_ms - b.pos_ms) / 60000)} left` : "not started" }).id);
  } else if (f.box === "podcasts") {
    const d = await api("/api/podcasts");
    f.kids = d.shows.map(p => mk({ id: "pod:" + p.id, kind: "podcast", pid: p.id, title: p.title, artist: p.author, count: p.episodes, fresh: p.new, eps: O["pod:" + p.id]?.eps || [] }).id);
  } else if (f.box === "stations") {
    const d = await api("/api/radio");
    f.kids = d.stations.map(s => stationObj(s).id);
  } else if (f.box === "playlists") {
    await loadPlaylists();
  } else if (f.box === "programmes") {
    await loadProgrammes();
  } else if (f.box === "lists") {
    const d = await api("/api/artists");
    f.kids = [SHOW.id, ...d.profiles.map(p => mk({ id: "ls:" + p.name, kind: "list", name: p.name, title: p.name, count: p.artists.length }).id)];
  }
  f.loaded = true;
}
const stationObj = s => mk({ id: "st:" + s.url, kind: "station", name: s.name, url: s.url, info: s.info || "Internet radio", title: s.name, short: initials(s.name).slice(0, 3) || "FM" });
async function loadAlbum(a) {
  const d = await api(`/api/browse?root=${a.root}&path=${encodeURIComponent(a.path)}`);
  if (!d.album) { a.tracks = []; return; }
  a.title = d.album.title; a.artist = d.album.artist;
  a.tracks = d.album.list.map(t => trackObj(a.root, t, d.album.title).id);
  a.loaded = true;
}
async function loadEpisodes(p) {
  const d = await api(`/api/podcasts/episodes?id=${encodeURIComponent(p.pid)}`);
  p.eps = d.episodes.map(e => mk({ id: `ep:${p.pid}:${e.guid}`, kind: "episode", pid: p.pid, guid: e.guid, title: e.title, min: e.duration_ms ? e.duration_ms / 60000 : null, h: p.h, done: e.done }).id);
  p.loaded = true;
}
async function loadPlaylists(d) {
  d = d || await api("/api/playlists");
  PLAYLISTS.kids = d.playlists.map(p => mk({ id: "pl:" + p.name.toLowerCase(), kind: "playlist", name: p.name, title: p.name,
    items: p.tracks.map(t => trackObj(t.root, { path: t.path, title: t.title, artist: t.artist }).id) }).id);
  PLAYLISTS.loaded = true;
}
async function loadProgrammes(d) {
  d = d || await api("/api/programmes");
  PROGRAMMES.kids = d.programmes.map(p => mk({ id: "pg:" + p.name.toLowerCase(), kind: "programme", title: p.name, start: p.start, auto: p.auto, days: p.days,
    then: p.then, blocks: p.blocks.map(b => ({ ...b, items: b.items.map(refObj).filter(Boolean).map(o => o.id) })) }).id);
  PROGRAMMES.loaded = true;
}
// a programme's saved things <-> the objects on the desktop
function refObj(r) {
  switch (r.kind) {
    case "album": { const id = (r.deep ? "f:" : "a:") + r.root + ":" + r.folder; return O[id] || mk({ id, kind: r.deep ? "folder" : "album", title: lastPart(r.folder), root: r.root, path: r.folder, kids: [], alt: r.root === "ondemand" }); }
    case "track": return O["t:" + r.root + ":" + r.path] || trackObj(r.root, { path: r.path });
    case "station": return O["st:" + r.url] || stationObj(r);
    case "playlist": return O["pl:" + r.name.toLowerCase()] || mk({ id: "pl:" + r.name.toLowerCase(), kind: "playlist", name: r.name, title: r.name, items: [] });

  else wrap.append(el("p", { className: "muted", textContent: "Drop anything from the desktop or a window onto the timeline to add a block: an album, a folder, songs, a station, a playlist, a book, a podcast, Sleep Radio or an artist list. Drop onto a block to add to it. Lengths of music are estimates." }));
  body.append(wrap);
  box.append(body);
}
function inspector(o, b, win) {
  const i = win.blk;
  const name = el("input", { className: "name", value: b.name, id: `bn-${o.id}-${i}` });
  name.setAttribute("aria-label", "Block name");
  name.onchange = () => { b.name = name.value || "Untitled"; saveProgrammes(); };
  const rule = el("select", { id: `rule-${o.id}-${i}` });
  rule.setAttribute("aria-label", "How long it plays");
  for (const [v, s] of [["for", "Play for"], ["until", "Play until"], ["end", "Play until it ends"], ["at", "Start at, sharp"]]) rule.append(new Option(s, v, false, b.rule === v));
  const tl = timeline(o)[i];
  rule.onchange = () => { b.rule = rule.value; if (b.rule === "until" && !b.until) b.until = hhmm(tl.end); if (b.rule === "at" && !b.at) b.at = hhmm(tl.start); if (!b.min) b.min = 60; saveProgrammes(); };
  const line1 = el("div", { className: "line" }, name, rule);
  if (b.rule === "at") { const at = el("input", { type: "time", value: b.at, id: `at-${o.id}-${i}` }); at.setAttribute("aria-label", "At"); at.onchange = () => { b.at = at.value; saveProgrammes(); }; line1.append(at, el("span", { className: "muted", textContent: "for" })); }
  if (b.rule === "for" || b.rule === "at") { const m = el("select", { id: `min-${o.id}-${i}` }); m.setAttribute("aria-label", "For");
    for (const v of [15, 30, 45, 60, 90, 120, 180, 240]) m.append(new Option(dur(v), v, false, (b.min || 60) === v)); if (![15, 30, 45, 60, 90, 120, 180, 240].includes(b.min || 60)) m.append(new Option(dur(b.min), b.min, false, true));
    m.onchange = () => { b.min = +m.value; saveProgrammes(); }; line1.append(m); }
  if (b.rule === "until") { const u = el("input", { type: "time", value: b.until, id: `until-${o.id}-${i}` }); u.setAttribute("aria-label", "Until"); u.onchange = () => { b.until = u.value; saveProgrammes(); }; line1.append(u); }
  const line2 = el("div", { className: "line" });
  for (const [v, s] of [["inorder", "In order"], ["shuffle", "Shuffle"]]) { const p = el("button", { className: "pill", type: "button", textContent: s }); p.setAttribute("aria-pressed", String((b.order || "inorder") === v)); p.onclick = () => { b.order = v; saveProgrammes(); }; line2.append(p); }
  const dj = b.items.some(id => ["album", "track", "playlist", "folder"].includes(O[id]?.kind) && O[id]?.root !== "ondemand") || b.items.some(id => ["list", "show"].includes(O[id]?.kind));
  line2.append(el("span", { className: "muted", textContent: dj ? "The DJ follows your DJ setting" : "No DJ over stations, books, podcasts or On demand" }));
  const del = el("button", { className: "pill", type: "button", textContent: "Delete block", style: "margin-left:auto" });
  del.onclick = () => { o.blocks.splice(i, 1); win.blk = Math.max(0, i - 1); saveProgrammes(); };
  line2.append(del);
  const line3 = el("div", { className: "line" });
  b.items.forEach(id => { const it = O[id]; if (!it) return; const x = el("button", { type: "button", textContent: "✕", title: "Take it out" }); x.onclick = () => { b.items = b.items.filter(v => v !== id); saveProgrammes(); };
    line3.append(el("span", { className: "chipx" }, glyph(it), it.title, x)); });
  if (!b.items.length) line3.append(el("span", { className: "muted", textContent: "Empty: drop things onto the block." }));
  return el("div", { className: "insp" }, line1, line2, line3);
}

// ============ pointer: select, open, drag and drop ============
let lastTap = { key: "", t: 0 };
function press(e, node, src) {
  if (e.button > 0) return;
  e.stopPropagation();
  const key = src.id + "@" + src.where, x0 = e.clientX, y0 = e.clientY;
  let ghost = null, over = null;
  node.setPointerCapture?.(e.pointerId);
  const move = ev => {
    if (!ghost && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 5) return;
    if (!ghost) { ghost = src.row ? iconEl(O[src.id], { where: "ghost" }) : node.cloneNode(true); ghost.classList.add("ghost"); ghost.classList.remove("sel"); document.body.append(ghost); }
    ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px";
    const hit = document.elementsFromPoint(ev.clientX, ev.clientY).find(n => n.dataset?.drop && n !== node && !n.classList.contains("ghost") && n.dataset.target !== src.id);
    if (hit !== over) { over?.classList.remove("over"); over = hit; over?.classList.add("over"); }
  };
  const up = ev => {
    node.removeEventListener("pointermove", move); node.removeEventListener("pointerup", up); node.removeEventListener("pointercancel", up);
    ghost?.remove(); over?.classList.remove("over");
    if (!ghost && src.where === "back") { open(src.id); return; }
    if (!ghost) {
      const t = Date.now();
      if (lastTap.key === key && t - lastTap.t < 380) { lastTap = { key: "", t: 0 }; open(src.id); return; }
      lastTap = { key, t }; sel = key; drawDesk(); return;
    }
    drop(src, over, ev);
  };
  node.addEventListener("pointermove", move); node.addEventListener("pointerup", up); node.addEventListener("pointercancel", up);
}
async function drop(src, target, ev) {
  const o = O[src.id];
  if (!target || !o) return;
  const kind = target.dataset.drop;
  if (kind === "desk") {
    const d = $("desk").getBoundingClientRect(), x = ev.clientX - d.left - 48, y = ev.clientY - d.top - 30;
    if (src.where === "desk") { const p = desk.find(p => p.id === src.id); if (p) { p.x = x; p.y = y; } }
    else if (!desk.some(p => p.id === src.id)) { desk.push({ id: src.id, x, y, alias: true }); toast(`A shortcut to “${o.title}” is on the desktop.`); }
    saveDesk(); return drawDesk();
  }
  if (kind === "play") { if (o.kind === "panel") return open(o.id); if (o.kind === "note") return open(PANEL.messages.id); return play(o); }
  if (kind === "preset") return setPreset(+target.dataset.n, o);
  const dest = O[target.dataset.target];
  if (!dest) return;
  if (dest.kind === "trash") return trash(src);
  if (dest.kind === "playlist") return addToPlaylist(dest, o);
  if (dest.kind === "programme") {
    if (!objRef(o)) return toast(`“${o.title}” can't go in a programme.`);
    await fetchLengths([o]);                         // its real running time, from the radio
    if (kind === "blk") { const b = dest.blocks[+target.dataset.i]; if (!b.items.includes(o.id)) b.items.push(o.id); await saveProgrammes(`Added “${o.title}” to “${b.name}”.`); }
    else { dest.blocks.push({ name: o.title.slice(0, 40), items: [o.id], rule: lenOf(o) == null ? "for" : "end", min: 60, order: "inorder" });
           const w = W.find(w => w.id === dest.id); if (w) w.blk = dest.blocks.length - 1; await saveProgrammes(`New block: “${o.title}”.`); }
    return;
  }
  if (dest.box === "playlists") return toast("Drop it onto one of the playlists.");
  if (dest.box === "programmes") return toast("Drop it onto one programme, or into its timeline.");
  if (dest.kind === "folder" && dest.root) return moveInto(src, dest);
}
async function addToPlaylist(pl, o) {
  const what = o.kind === "track" ? { root: o.root, path: o.path } : o.kind === "album" ? { root: o.root, folder: o.path }
    : o.kind === "folder" && o.root && o.path ? { root: o.root, folder: o.path, deep: true } : null;
  if (!what) return toast(`A playlist holds songs; “${o.title}” can go in a programme instead.`);
  try { const d = await api("/api/playlists/add", { name: pl.name, ...what }); await loadPlaylists(d); drawDesk(); toast(`Added ${d.added === 1 ? "“" + o.title + "”" : d.added + " songs"} to ${d.name}.`); }
  catch (e) { toast("Not added: " + e.message + "."); }
}
function ask(msg, yes, fn) {
  const box = el("div", { className: "confirm" });
  const no = el("button", { type: "button", textContent: "Cancel" }), go = el("button", { type: "button", className: "danger", textContent: yes });
  no.onclick = () => box.remove(); go.onclick = () => { box.remove(); fn(); };
  box.append(el("div", { className: "box", role: "dialog" }, el("p", { textContent: msg }), el("div", { className: "btns" }, no, go)));
  document.body.append(box); go.focus();
}
function trash(src) {
  const o = O[src.id];
  if (src.where === "desk") {
    const p = desk.find(p => p.id === src.id);
    if (p && (p.alias || !["folder", "trash"].includes(o.kind))) { desk.splice(desk.indexOf(p), 1); saveDesk(); drawDesk(); return toast(`Took “${o.title}” off the desktop. The real one is still on the radio.`); }
    return toast(`${o.title} stays on the desktop.`);
  }
  const from = O[src.parent];
  if (from?.kind === "playlist") {
    const items = from.items.filter((_, i) => i !== src.index);
    const all = PLAYLISTS.kids.map(id => O[id]).map(p => ({ name: p.name, tracks: (p === from ? items : p.items).map(id => [O[id].root, O[id].path]) }));
    return api("/api/playlists", { playlists: all }).then(d => { loadPlaylists(d); drawDesk(); toast(`Took “${o.title}” out of ${from.title}.`); }).catch(e => toast(e.message));
  }
  if (o.kind === "playlist") return ask(`Delete the playlist “${o.title}”? The songs stay on the radio.`, "Delete playlist", async () => {
    const all = PLAYLISTS.kids.map(id => O[id]).filter(p => p !== o).map(p => ({ name: p.name, tracks: p.items.map(id => [O[id].root, O[id].path]) }));
    try { await loadPlaylists(await api("/api/playlists", { playlists: all })); closeFor(o); toast(`Deleted ${o.title}.`); } catch (e) { toast(e.message); }
  });
  if (o.kind === "programme") return ask(`Delete the programme “${o.title}”?`, "Delete programme", async () => {
    PROGRAMMES.kids = PROGRAMMES.kids.filter(id => id !== o.id); closeFor(o); await saveProgrammes(`Deleted ${o.title}.`);
  });
  if ((o.root && o.path) || o.kind === "book") {
    const what = o.kind === "folder" ? "the folder and everything in it" : o.kind === "album" ? "the album (its folder)" : "it";
    return ask(`Delete “${o.title}” from the radio for good? This deletes ${what}, and can't be undone.`, "Delete for good", async () => {
      try { await api("/api/media/delete", { kind: o.kind === "book" ? "audiobooks" : o.root, path: o.kind === "book" ? o.key : o.path });
            closeFor(o); await afterChange([from, o.kind === "book" ? BOOKS : null].filter(Boolean)); toast(`Deleted ${o.title}.`); }
      catch (e) { toast("Not deleted: " + e.message + "."); }
    });
  }
  toast(`“${o.title}” can't go in the Trash.`);
}
function closeFor(o) { for (let i = W.length - 1; i >= 0; i--) if (W[i].id === o.id) W.splice(i, 1); desk = desk.filter(p => p.id !== o.id); saveDesk(); drawDesk(); }
function pressBlock(e, blkEl, prog, i, win) {
  e.stopPropagation();
  const x0 = e.clientX; let moved = false;
  blkEl.setPointerCapture?.(e.pointerId);
  const blocks = [...blkEl.parentElement.querySelectorAll(".blk")];
  const move = ev => { if (Math.abs(ev.clientX - x0) > 5) { moved = true; blkEl.style.transform = `translateX(${ev.clientX - x0}px)`; blkEl.style.zIndex = 5; } };
  const up = ev => {
    blkEl.removeEventListener("pointermove", move); blkEl.removeEventListener("pointerup", up);
    if (!moved) return drawDesk();
    const xs = blocks.map(b => b.getBoundingClientRect()).map(r => r.left + r.width / 2);
    let to = xs.filter(x => x < ev.clientX).length; if (to > i) to--;
    const [b] = prog.blocks.splice(i, 1); prog.blocks.splice(to, 0, b); win.blk = to; saveProgrammes();
  };
  blkEl.addEventListener("pointermove", move); blkEl.addEventListener("pointerup", up);
}
function stretch(e, prog, i, px) {
  e.stopPropagation();
  const b = prog.blocks[i], x0 = e.clientX, start = timeline(prog)[i].len, blkEl = e.target.parentElement;
  e.target.setPointerCapture?.(e.pointerId);
  const snap = m => Math.max(15, Math.round(m / 15) * 15);
  const move = ev => { blkEl.style.width = Math.max(18, snap(start + (ev.clientX - x0) / px) * px - 2) + "px"; };
  const up = ev => { e.target.removeEventListener("pointermove", move); e.target.removeEventListener("pointerup", up);
    b.min = snap(start + (ev.clientX - x0) / px); if (b.rule !== "at") b.rule = "for"; saveProgrammes(`“${b.name}”: ${dur(b.min)}.`); };
  e.target.addEventListener("pointermove", move); e.target.addEventListener("pointerup", up);
}
function moveThing(e, node, save, isWin) {
  e.preventDefault();
  const r = node.getBoundingClientRect(), d = $("desk").getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
  const t = e.target; t.setPointerCapture?.(e.pointerId);
  const move = ev => { node.style.left = Math.max(-r.width + 80, Math.min(d.width - 60, ev.clientX - d.left - dx)) + "px"; node.style.top = Math.max(0, Math.min(d.height - 30, ev.clientY - d.top - dy)) + "px"; };
  const up = () => { t.removeEventListener("pointermove", move); t.removeEventListener("pointerup", up); save(parseFloat(node.style.left), parseFloat(node.style.top)); if (isWin) drawDesk(); };
  t.addEventListener("pointermove", move); t.addEventListener("pointerup", up);
}
function resizeThing(e, node, win) {
  e.stopPropagation(); e.preventDefault();
  const x0 = e.clientX, y0 = e.clientY, w0 = win.w, h0 = win.h, t = e.target;
  t.setPointerCapture?.(e.pointerId);
  const move = ev => { node.style.width = Math.max(280, w0 + ev.clientX - x0) + "px"; node.style.height = Math.max(180, h0 + ev.clientY - y0) + "px"; };
  const up = () => { t.removeEventListener("pointermove", move); t.removeEventListener("pointerup", up); win.w = parseFloat(node.style.width); win.h = parseFloat(node.style.height); drawDesk(); };
  t.addEventListener("pointermove", move); t.addEventListener("pointerup", up);
}

// ============ the rest ============
(function () {
  const root = document.documentElement;
  let saved = null; try { saved = localStorage.getItem("srd.theme"); } catch {}
  root.dataset.theme = saved || "light";
  const label = () => { $("theme").textContent = root.dataset.theme === "dark" ? "Light" : "Dark"; };
  $("theme").onclick = () => { root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark"; try { localStorage.setItem("srd.theme", root.dataset.theme); } catch {} label(); };
  label();
})();
$("desk").addEventListener("pointerdown", e => { if (e.target === $("desk") && sel) { sel = null; drawDesk(); } });
document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => open(b.dataset.open));
$("tidy").onclick = () => { desk.forEach((p, i) => { p.x = 18 + Math.floor(i / 7) * 128; p.y = 14 + (i % 7) * 96; }); saveDesk(); drawDesk(); };
$("settingsMenu").onclick = () => { if (!radioBack) turnRadio(); toast("Every setting is on the back of the radio. Or click a part of it: the speakers, the knob, the buttons, its name."); };
$("wifiMenu").onclick = () => open(PANEL.wifi.id);
let tt;
function toast(msg, sticky) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); if (!sticky) tt = setTimeout(() => t.hidden = true, 4500); }
function tick() { const d = new Date(); $("clock").textContent = d.toLocaleDateString(undefined, { weekday: "short" }) + " " + d.toTimeString().slice(0, 5); }
window.addEventListener("resize", () => drawDesk());
let booted = false;
async function boot() {
  tick();
  if (!booted) loadDesk();
  await Promise.all([poll(), loadButtons(), loadProgrammes().catch(() => {}), loadPlaylists().catch(() => {})]);
  document.title = radioName; SHOW.title = radioName;
  drawDesk();
  if (!booted) { booted = true; setInterval(tick, 10000); setInterval(poll, 2500); setInterval(async () => { await loadButtons(); updateRadio(); }, 15000); }
}
boot();
</script>
