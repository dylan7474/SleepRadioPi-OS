# /etc/nsswitch.conf
#
# The radio's own, over Buildroot's: hosts asks mDNS (nss-mdns, so that avahi finds the support it looks for, and so
# the radio can reach other devices by their name.local) only for *.local names, then DNS. nss-mdns's own edit also adds
# a trailing "mdns4", which makes every name that DNS cannot find (a dead station's host) wait seconds for mDNS first.

passwd:         files
group:          files
shadow:         files

hosts:          files mdns4_minimal [NOTFOUND=return] dns
networks:       files dns

protocols:      files
services:       files
ethers:         files
rpc:            files
